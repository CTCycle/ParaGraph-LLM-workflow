[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[project]
name = "paragraph"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "fastapi==0.128.0",
    "uvicorn[standard]==0.40.0",
    "pydantic==2.12.0",
    "pydantic-settings==2.11.0",
    "pandas==3.0.0",
    "SQLAlchemy==2.0.46",
    "psycopg[binary]==3.3.1",
    "python-dotenv==1.2.1",
    "python-multipart==0.0.21",
    "httpx==0.28.1",
    "huggingface_hub==1.5.0",
    "transformers==5.4.0",
    "torch==2.11.0",
    "numpy==2.4.1",
    "beautifulsoup4==4.12.3",
    "jinja2>=3.1.0",
    "markdown-it-py>=3.0.0",
    "pillow>=10.0.0",
    "pypdf==5.4.0",
    "pytesseract>=0.3.10",
    "python-docx==1.1.2",
    "python-dateutil>=2.9.0.post0",
    "rapidfuzz>=3.0.0",
    "faiss-cpu==1.13.2",
    "lancedb==0.30.0",
    "qdrant-client",
    "pinecone",
    "weaviate-client",
    "pymilvus",
    "chromadb",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-playwright>=0.5.0",
    "psutil>=6.1.1",
    "ruff==0.15.9"
]

[tool.hatch.build.targets.wheel]
packages = ["server"]


