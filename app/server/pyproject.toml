[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[project]
name = "paragraph"
version = "1.0.0"
requires-python = ">=3.14"

dependencies = [
    "alembic==1.19.0",
    "fastapi==0.136.3",
    "uvicorn[standard]==0.48.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "pandas==3.0.3",
    "SQLAlchemy==2.0.50",
    "psycopg[binary]==3.3.4",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.29",
    "httpx==0.28.1",
    "huggingface_hub==1.5.0",
    "transformers==5.4.0",
    "torch==2.11.0",
    "numpy==2.4.6",
    "beautifulsoup4==4.12.3",
    "jinja2>=3.1.0",
    "markdown-it-py>=3.0.0",
    "pillow>=10.0.0",
    "pypdf==5.4.0",
    "pytesseract>=0.3.10",
    "python-docx==1.1.2",
    "python-dateutil>=2.9.0.post0",
    "rapidfuzz>=3.0.0",
    "faiss-cpu==1.14.2",
    "lancedb==0.30.2",
    "qdrant-client",
    "pinecone",
    "weaviate-client",
    "pymilvus",
    "chromadb",
    "portalocker==3.2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-playwright>=0.5.0",
    "psutil>=6.1.1",
    "ruff==0.15.9"
]

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.ruff]
extend = "../../ruff.toml"

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["%(here)s/.."]

