name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  backend-validation:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync Test Dependencies
        run: uv --project app/server sync --extra test

      - name: Lint Backend
        run: uv --project app/server run ruff check app/server app/tests

      - name: Compile Backend
        run: uv --project app/server run python -m compileall app/server/app.py app/server/api app/server/common app/server/configurations app/server/domain app/server/repositories app/server/services

      - name: Run Backend Tests
        run: uv --project app/server run pytest app/tests/unit/server app/tests/e2e/server/test_execution_lifecycle.py

  frontend-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/client/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: app/client
        run: npm ci

      - name: Lint Frontend
        working-directory: app/client
        run: npm run lint

      - name: Build Frontend
        working-directory: app/client
        run: npm run build

      - name: Run Frontend Unit Tests
        working-directory: app/client
        run: npm run test:unit
