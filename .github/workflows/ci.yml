name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  python-sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Python sanity
        run: |
          python --version
          python -c "print('python sanity ok')"
