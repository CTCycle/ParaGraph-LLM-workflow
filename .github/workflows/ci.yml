name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  backend-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync Test Dependencies
        run: uv sync --extra test

      - name: Lint Backend
        run: uv run ruff check ParaGraph/server tests

      - name: Compile Backend
        run: uv run python -m compileall ParaGraph/server

      - name: Run Backend Tests
        run: uv run pytest tests/unit/server tests/e2e/server/test_execution_lifecycle.py
