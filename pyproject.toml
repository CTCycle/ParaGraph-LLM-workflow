[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "paragraph"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "fastapi==0.128.0",
    "uvicorn[standard]==0.40.0",
    "pydantic==2.12.0",
    "pandas==3.0.0",
    "SQLAlchemy==2.0.46",
    "psycopg[binary]==3.3.1",
    "python-dotenv==1.2.1",
    "python-multipart>=0.0.21",
    "httpx==0.28.1",
    "huggingface_hub>=0.35.0",
    "numpy>=2.2.0",
    "beautifulsoup4>=4.12.3",
    "pypdf>=5.4.0",
    "python-docx>=1.1.2",
    "faiss-cpu>=1.11.0",
    "lancedb>=0.25.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
huggingface = [
    "transformers>=4.48.0",
    "torch>=2.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ParaGraph"]
